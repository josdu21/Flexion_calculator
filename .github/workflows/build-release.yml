name: Build & Release

on:
  push:
    tags:
      - 'v*'        # se dispara al hacer push de un tag tipo v1.0.0
  workflow_dispatch: # también permite correrlo manualmente

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Si el tag y la versión del código difieren, se publicaría un instalador
      # con un número que no corresponde. Mejor fallar acá.
      - name: Check the tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          declarada=$(python -c "from core.version import __version__; print(__version__)")
          etiqueta="${GITHUB_REF_NAME#v}"
          echo "tag=$etiqueta  core/version.py=$declarada"
          if [ "$declarada" != "$etiqueta" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión $declarada"
            exit 1
          fi

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build standalone executable
        run: packaging\build_nuitka.bat
        shell: cmd

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: iscc packaging\installer.iss
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeamCalculator-windows-setup
          # El instalador ya lleva la versión en el nombre.
          path: distro/BeamCalculator-Setup-*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installer
        run: |
          mkdir release
          cp artifacts/BeamCalculator-windows-setup/BeamCalculator-Setup-*.exe release/
          ls -lh release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          name: Beam Calculator ${{ github.ref_name }}
          body: |
            ## 📦 Beam Calculator ${{ github.ref_name }}

            Diseño de refuerzo por flexión, cortante y torsión según ACI 318-19.

            Los cambios de esta versión están en
            [CHANGELOG.md](https://github.com/josdu21/Flexion_calculator/blob/${{ github.ref_name }}/CHANGELOG.md).

            ### Instalación

            Descarga `BeamCalculator-Setup-*.exe` y ejecútalo. Queda instalado en
            Program Files con acceso desde el menú Inicio (y, si lo eliges, un
            acceso directo en el escritorio). Incluye desinstalador.

            Si ya tenías una versión anterior, el instalador **la actualiza en
            sitio**: no hace falta desinstalarla antes.
